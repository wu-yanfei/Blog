baseURL = "https://blog.yfwu.de/"
title = "Fly.log"
theme = ["FixIt"]
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
mainSections = ["posts"]
summaryLength = 20

[languages]
  [languages.zh-cn]
    locale = "zh-CN"
    label = "简体中文"
    direction = "ltr"
    title = "Fly.log"
    weight = 1
    hasCJKLanguage = true
    [languages.zh-cn.params]
      description = "记录技术、研究与折腾过程"
    [languages.zh-cn.params.header.subtitle]
      name = "记录技术、研究与折腾过程"
    [languages.zh-cn.params.search]
      placeholder = "搜索文章"

  [languages.en]
    locale = "en"
    label = "English"
    direction = "ltr"
    title = "Fly.log"
    weight = 2
    [languages.en.params]
      description = "Notes on tech, research, and experiments"
    [languages.en.params.header.subtitle]
      name = "Notes on tech, research, and experiments"
    [languages.en.params.search]
      placeholder = "Search posts"

[pagination]
  pagerSize = 10

[frontmatter]
  lastmod = ["lastmod", "date"]

# 继承 FixIt 主题自带的 markup / outputs / taxonomies 配置
# FixIt 官方文档推荐这样写
[markup]
  _merge = "shallow"

[outputs]
  _merge = "shallow"

[taxonomies]
  _merge = "shallow"


[permalinks]
  [permalinks.page]
    posts = "/p/:slugorcontentbasename/"

[languages.zh-cn.menus]

  [[languages.zh-cn.menus.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
    [languages.zh-cn.menus.main.params]
      icon = "fa-solid fa-home"

  [[languages.zh-cn.menus.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 2
    [languages.zh-cn.menus.main.params]
      icon = "fa-solid fa-file-lines"

  [[languages.zh-cn.menus.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 3
    [languages.zh-cn.menus.main.params]
      icon = "fa-solid fa-folder-tree"

  [[languages.zh-cn.menus.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 4
    [languages.zh-cn.menus.main.params]
      icon = "fa-solid fa-tags"

  [[languages.zh-cn.menus.main]]
    identifier = "guestbook"
    name = "留言板"
    url = "/guestbook/"
    weight = 5
    [languages.zh-cn.menus.main.params]
      icon = "fa-solid fa-comments"

  [[languages.zh-cn.menus.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 6
    [languages.zh-cn.menus.main.params]
      icon = "fa-solid fa-user"

[languages.en.menus]

  [[languages.en.menus.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
    [languages.en.menus.main.params]
      icon = "fa-solid fa-home"

  [[languages.en.menus.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 2
    [languages.en.menus.main.params]
      icon = "fa-solid fa-file-lines"

  [[languages.en.menus.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 3
    [languages.en.menus.main.params]
      icon = "fa-solid fa-folder-tree"

  [[languages.en.menus.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 4
    [languages.en.menus.main.params]
      icon = "fa-solid fa-tags"

  [[languages.en.menus.main]]
    identifier = "guestbook"
    name = "Guestbook"
    url = "/guestbook/"
    weight = 5
    [languages.en.menus.main.params]
      icon = "fa-solid fa-comments"

  [[languages.en.menus.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 6
    [languages.en.menus.main.params]
      icon = "fa-solid fa-user"

[params]
  version = "0.4.X"
  description = "Fly.log"
  keywords = ["Hugo", "FixIt", "Obsidian", "Docker", "Linux"]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  summaryPlainify = true
  capitalizeTitles = false

[params.author]
  name = "wu-yanfei"
  email = ""
  link = "https://github.com/wu-yanfei"
  avatar = ""

[params.header]
  desktopMode = "sticky"
  mobileMode = "auto"

[params.header.title]
  name = "Fly.log"
  pre = ""
  post = ""
  typeit = false

[params.header.subtitle]
  name = "记录技术、研究与折腾过程"
  typeit = false

[params.breadcrumb]
  enable = true
  sticky = false
  showHome = true

[params.footer]
  enable = true
  copyright = true
  author = true
  since = "2026"
  license = ""

[params.footer.powered]
  enable = true
  hugoLogo = false
  themeLogo = false

[params.home]

[params.home.posts]
  enable = true
  paginate = 8

[params.search]
  enable = true
  type = "fuse"
  contentLength = 4000
  placeholder = "搜索文章"
  maxResultLength = 10
  snippetLength = 30
  highlightTag = "em"
  absoluteURL = false

[params.search.fuse]
  isCaseSensitive = false
  minMatchCharLength = 2
  findAllMatches = false
  location = 0
  threshold = 0.3
  distance = 100
  ignoreLocation = false
  useExtendedSearch = false
  ignoreFieldNorm = false

[params.social]
  GitHub = "wu-yanfei"

[params.tagcloud]
  enable = true
  min = 14
  max = 32
  peakCount = 10
  orderby = "name"

[params.archives]
  paginate = 20
  dateFormat = "01-02"

[params.section]
  paginate = 20
  dateFormat = "01-02"

[params.list]
  paginate = 20
  dateFormat = "01-02"

[params.page]
  authorAvatar = false
  hiddenFromHomePage = false
  hiddenFromSearch = false
  hiddenFromRelated = false
  hiddenFromFeed = false

  twemoji = false
  lightgallery = false
  ruby = true
  fraction = true
  fontawesome = true

  linkToMarkdown = false
  linkToSource = false
  linkToEdit = false
  linkToReport = false
  linkToVscode = false

  pageStyle = "normal"
  autoBookmark = false
  showLastmod = false
  wordCount = true
  readingTime = true
  endFlag = ""

[params.page.toc]
  enable = true
  keepStatic = false
  auto = true
  position = "right"
  ordered = false
  startLevel = 2
  endLevel = 4

[params.page.share]
  enable = false

[params.page.comment]
  enable = false

[params.page.comment.waline]
  enable = true
  serverURL = "https://waline.yfwu.de"
  dark = "html[data-theme-mode='dark']"

[params.page.math]
  enable = false
  type = "katex"

[params.codeblock]
  wrapper = true
  copyable = true
  lineNosToggler = true
  lineWrapToggler = true
  maxShownLines = 20
  mode = "classic"

[params.image]
  optimise = true
  cacheRemote = false
  blackList = ["*.svg", "*.gif", "*.ico", "*.avif"]

[imaging]
  quality = 82
  resampleFilter = "lanczos"
  [imaging.webp]
    method = 6
    useSharpYuv = true


[params.busuanzi]
  enable = true
  siteViews = true
  pageViews = true
  source = "https://vercount.one/js"

[caches]
  [caches.images]
    dir = ":cacheDir/images"
